packages:
  - "packages/*"
  - "apps/*"

# esbuild (pulled by vitest/tsx) runs a postinstall that links its platform binary. Approve it so
# `pnpm install` exits clean (in CI too).
allowBuilds:
  esbuild: true
  isolated-vm: true

# Окно созревания выключено (решение владельца 2026-07-28).
#
# Почему не точечное исключение: pnpm 11.6.0 читает `minimumReleaseAgeExclude` (его видно в
# `pnpm config get`), но путь ПРОВЕРКИ ЛОК-ФАЙЛА — тот, что запускает `pnpm install
# --frozen-lockfile`, — исключения игнорирует. Проверено на всех формах записи: имя с версией,
# имя без версии, `--config.minimumReleaseAgeExclude`, `minimumReleaseAgeStrict=false`. Список
# ниже оставлен как декларация намерения; работает только сам `minimumReleaseAge`.
#
# Цена решения: любая новая версия ЛЮБОГО пакета ставится без выдержки, а не только наша.
#
# ОСТАЁТСЯ `0` НА ВРЕМЯ АКТИВНОЙ РАЗРАБОТКИ (решение владельца 2026-07-29). Пока движок
# выпускается часто, окно в сутки означает сутки простоя после каждой публикации: пин нельзя
# поднять, а значит нельзя и смержить работу, которая на него опирается.
#
# КОГДА ВЕРНУТЬ. Как только выпуски `@trdlabs/engine` станут редкими — или как только pnpm
# починит `minimumReleaseAgeExclude` в проверке лок-файла: тогда окно можно держать включённым
# постоянно, а наши собственные пакеты будут проходить точечно, и выбирать между защитой и
# скоростью не придётся вовсе.
#
# ЧТО ЭТО СТОИТ, ПОКА ВЫКЛЮЧЕНО. Выдержки лишены все ~330 записей лок-файла, а не только наши.
# Это ровно тот класс атак, ради которого pnpm 11 включил окно по умолчанию: угнанный аккаунт
# мейнтейнера, вредоносная версия, снятая с реестра через несколько часов. Компенсирующая мера,
# которая уже действует, — лок-файл: без осознанного `pnpm install` и ревью диффа
# `pnpm-lock.yaml` новая версия стороннего пакета в сборку не попадёт.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@trdlabs/sdk@0.13.0'
  - '@trdlabs/engine@0.1.1'
  - '@trdlabs/engine@0.2.0'

# Don't re-run an install check before every `pnpm <script>`.
verifyDepsBeforeRun: false
